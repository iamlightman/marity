# ==============================================================================
# MARITY TRADE — CODEMAGIC CI/CD WORKFLOW CONFIGURATION
# Dual Pipeline:
#   1. ios-release: Full App Store / TestFlight Production Build & Code Signing
#   2. ios-debug: Fast Simulator / Verification Build (Zero Apple Certs Needed)
# ==============================================================================

workflows:
  ios-release:
    name: Marity Trade — iOS Release (App Store / TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Marity Key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.maritytrade.app
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        APP_ID: "com.maritytrade.app"
        DEVELOPMENT_TEAM: "T3RLFNGN9A"
      xcode: latest
      cocoapods: default
      node: 20
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: master
          include: true
          source: true
    scripts:
      - name: Install dependencies & build web bundle
        script: |
          echo ">>> Installing Node dependencies..."
          npm install --legacy-peer-deps
          echo ">>> Preparing production iOS web bundle..."
          node tools/prepare_ios_bundle.js
      - name: Setup Capacitor iOS Native Project
        script: |
          echo ">>> Initializing Capacitor iOS Platform..."
          if [ ! -f "ios/App/App.xcodeproj/project.pbxproj" ]; then
            echo ">>> Running npx cap add ios to generate Xcode project..."
            rm -rf ios
            npx cap add ios
          fi
          
          # Inject custom high-res luxury icons & splash screen
          if [ -d "tools/ios_assets" ]; then
            echo ">>> Injecting luxury AppIcon & Splash assets..."
            mkdir -p ios/App/App/Assets.xcassets/AppIcon.appiconset
            mkdir -p ios/App/App/Assets.xcassets/Splash.imageset
            cp -R tools/ios_assets/AppIcon.appiconset/* ios/App/App/Assets.xcassets/AppIcon.appiconset/ 2>/dev/null || true
            cp -R tools/ios_assets/Splash.imageset/* ios/App/App/Assets.xcassets/Splash.imageset/ 2>/dev/null || true
            cp tools/ios_assets/Info.plist ios/App/App/Info.plist 2>/dev/null || true
          fi
          
          echo ">>> Syncing Capacitor..."
          npx cap sync ios
          
          # Re-apply custom Info.plist with iPad orientations & fullscreen flag
          if [ -f "tools/ios_assets/Info.plist" ]; then
            cp tools/ios_assets/Info.plist ios/App/App/Info.plist 2>/dev/null || true
          fi
          
          # Set minimum iOS deployment target to 15.0 for App Store compliance
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/App/App.xcodeproj/project.pbxproj 2>/dev/null || true
          sed -i '' "s/platform :ios, '13.0'/platform :ios, '15.0'/g" ios/App/Podfile 2>/dev/null || true
      - name: Install CocoaPods dependencies
        script: |
          echo ">>> Installing CocoaPods..."
          cd ios/App
          pod install --repo-update
      - name: Set up code signing on Xcode project
        script: |
          echo ">>> Applying code signing profiles to Xcode project..."
          xcode-project use-profiles --project ios/App/App.xcodeproj
      - name: Increment build version
        script: |
          echo ">>> Setting App Version and Build Number..."
          cd ios/App
          BUILD_NUM=$(git rev-list --count HEAD 2>/dev/null || echo 1)
          agvtool new-version -all $BUILD_NUM
          agvtool new-marketing-version 1.0.0
      - name: Build IPA for App Store
        script: |
          echo ">>> Building and packaging IPA..."
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - "*.dSYM.zip"
    publishing:
      app_store_connect:
        auth: integration
      email:
        recipients:
          - admin@maritytrade.com
        notify:
          success: true
          failure: true

  ios-debug:
    name: Marity Trade — iOS Simulator Build (No Certs Required)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      xcode: latest
      cocoapods: default
      node: 20
    scripts:
      - name: Install dependencies & build web bundle
        script: |
          npm install --legacy-peer-deps
          node tools/prepare_ios_bundle.js
          if [ ! -f "ios/App/App.xcodeproj/project.pbxproj" ]; then
            rm -rf ios
            npx cap add ios
          fi
          if [ -d "tools/ios_assets" ]; then
            mkdir -p ios/App/App/Assets.xcassets/AppIcon.appiconset
            mkdir -p ios/App/App/Assets.xcassets/Splash.imageset
            cp -R tools/ios_assets/AppIcon.appiconset/* ios/App/App/Assets.xcassets/AppIcon.appiconset/ 2>/dev/null || true
            cp -R tools/ios_assets/Splash.imageset/* ios/App/App/Assets.xcassets/Splash.imageset/ 2>/dev/null || true
            cp tools/ios_assets/Info.plist ios/App/App/Info.plist 2>/dev/null || true
          fi
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install
      - name: Build for iOS Simulator
        script: |
          echo ">>> Compiling Marity Trade for iOS Simulator..."
          xcodebuild -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build/derivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build
          
          mkdir -p build/ios/simulator
          cd build/derivedData/Build/Products/Debug-iphonesimulator
          zip -r -X ../../../../../build/ios/simulator/MarityTrade-Simulator.app.zip App.app
    artifacts:
      - build/ios/simulator/*.zip
      - /tmp/xcodebuild_logs/*.log

  android-release:
    name: Marity Trade — Android Release (Google Play Bundle & APK)
    max_build_duration: 40
    instance_type: mac_mini_m2
    environment:
      vars:
        PACKAGE_NAME: "com.maritytrade.app"
      java: 17
      node: 20
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: master
          include: true
          source: true
    scripts:
      - name: Install dependencies & build mobile web bundle
        script: |
          echo ">>> Installing Node dependencies..."
          npm install --legacy-peer-deps
          echo ">>> Preparing production mobile web bundle..."
          node tools/prepare_ios_bundle.js
      - name: Setup Capacitor Android Native Project
        script: |
          echo ">>> Initializing Capacitor Android Platform..."
          if [ ! -d "android/app" ]; then
            echo ">>> Running npx cap add android to generate Android project..."
            rm -rf android
            npx cap add android
          fi
          
          # Inject luxury Android mipmap icons, splash, and colors
          if [ -d "tools/android_assets" ]; then
            echo ">>> Injecting luxury Android AppIcons and Splash..."
            cp -R tools/android_assets/mipmap-* android/app/src/main/res/ 2>/dev/null || true
            cp -R tools/android_assets/drawable* android/app/src/main/res/ 2>/dev/null || true
            cp -R tools/android_assets/values/* android/app/src/main/res/values/ 2>/dev/null || true
          fi
          
          # Enforce Google Play compliance (no unnecessary permissions)
          sed -i.bak '/android.permission.READ_PHONE_STATE/d' android/app/src/main/AndroidManifest.xml 2>/dev/null || true
          
          echo ">>> Syncing Capacitor Android..."
          npx cap sync android
      - name: Build Android Release Bundle (.aab) & APK
        script: |
          echo ">>> Building Android Release App Bundle & APK..."
          cd android
          ./gradlew bundleRelease assembleRelease
    artifacts:
      - android/app/build/outputs/bundle/**/*.aab
      - android/app/build/outputs/apk/**/*.apk

  android-debug:
    name: Marity Trade — Android Direct Install Test APK
    max_build_duration: 25
    instance_type: mac_mini_m2
    environment:
      java: 17
      node: 20
    scripts:
      - name: Install dependencies & build mobile bundle
        script: |
          npm install --legacy-peer-deps
          node tools/prepare_ios_bundle.js
          if [ ! -d "android/app" ]; then
            rm -rf android
            npx cap add android
          fi
          if [ -d "tools/android_assets" ]; then
            cp -R tools/android_assets/mipmap-* android/app/src/main/res/ 2>/dev/null || true
            cp -R tools/android_assets/drawable* android/app/src/main/res/ 2>/dev/null || true
            cp -R tools/android_assets/values/* android/app/src/main/res/values/ 2>/dev/null || true
          fi
          npx cap sync android
      - name: Build Debug APK
        script: |
          cd android
          ./gradlew assembleDebug
          mkdir -p ../build/android/test_apk
          cp app/build/outputs/apk/debug/*.apk ../build/android/test_apk/MarityTrade-Test-DirectInstall.apk
    artifacts:
      - build/android/test_apk/*.apk
      - android/app/build/outputs/apk/**/*.apk
