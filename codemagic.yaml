# ==============================================================================
# MARITY TRADE — CODEMAGIC CI/CD WORKFLOW CONFIGURATION
# Dual Pipeline:
#   1. ios-release: Full App Store / TestFlight Production Build & Code Signing
#   2. ios-debug: Fast Simulator / Verification Build (Zero Apple Certs Needed)
# ==============================================================================

workflows:
  ios-release:
    name: Marity Trade — iOS Release (App Store / TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Marity Key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.maritytrade.app
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        APP_ID: "com.maritytrade.app"
        DEVELOPMENT_TEAM: "T3RLFNGN9A"
      xcode: latest
      cocoapods: default
      node: 20
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: master
          include: true
          source: true
    scripts:
      - name: Install dependencies & build web bundle
        script: |
          echo ">>> Installing Node dependencies..."
          npm install --legacy-peer-deps
          echo ">>> Preparing production iOS web bundle..."
          node tools/prepare_ios_bundle.js
      - name: Setup Capacitor iOS Native Project
        script: |
          echo ">>> Initializing Capacitor iOS Platform..."
          if [ ! -f "ios/App/App.xcodeproj/project.pbxproj" ]; then
            echo ">>> Running npx cap add ios to generate Xcode project..."
            rm -rf ios
            npx cap add ios
          fi
          
          # Inject custom high-res luxury icons & splash screen
          if [ -d "tools/ios_assets" ]; then
            echo ">>> Injecting luxury AppIcon & Splash assets..."
            mkdir -p ios/App/App/Assets.xcassets/AppIcon.appiconset
            mkdir -p ios/App/App/Assets.xcassets/Splash.imageset
            cp -R tools/ios_assets/AppIcon.appiconset/* ios/App/App/Assets.xcassets/AppIcon.appiconset/ 2>/dev/null || true
            cp -R tools/ios_assets/Splash.imageset/* ios/App/App/Assets.xcassets/Splash.imageset/ 2>/dev/null || true
            cp tools/ios_assets/Info.plist ios/App/App/Info.plist 2>/dev/null || true
          fi
          
          echo ">>> Syncing Capacitor..."
          npx cap sync ios
          
          # Re-apply custom Info.plist with iPad orientations & fullscreen flag
          if [ -f "tools/ios_assets/Info.plist" ]; then
            cp tools/ios_assets/Info.plist ios/App/App/Info.plist 2>/dev/null || true
          fi
          
          # Set minimum iOS deployment target to 15.0 for App Store compliance
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/App/App.xcodeproj/project.pbxproj 2>/dev/null || true
          sed -i '' "s/platform :ios, '13.0'/platform :ios, '15.0'/g" ios/App/Podfile 2>/dev/null || true
      - name: Install CocoaPods dependencies
        script: |
          echo ">>> Installing CocoaPods..."
          cd ios/App
          pod install --repo-update
      - name: Set up code signing on Xcode project
        script: |
          echo ">>> Applying code signing profiles to Xcode project..."
          xcode-project use-profiles --project ios/App/App.xcodeproj
      - name: Increment build version
        script: |
          echo ">>> Setting App Version and Build Number..."
          cd ios/App
          BUILD_NUM=$(git rev-list --count HEAD 2>/dev/null || echo 1)
          agvtool new-version -all $BUILD_NUM
          agvtool new-marketing-version 1.0.0
      - name: Build IPA for App Store
        script: |
          echo ">>> Building and packaging IPA..."
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - "*.dSYM.zip"
    publishing:
      app_store_connect:
        auth: integration
      email:
        recipients:
          - admin@maritytrade.com
        notify:
          success: true
          failure: true

  ios-debug:
    name: Marity Trade — iOS Simulator Build (No Certs Required)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      xcode: latest
      cocoapods: default
      node: 20
    scripts:
      - name: Install dependencies & build web bundle
        script: |
          npm install --legacy-peer-deps
          node tools/prepare_ios_bundle.js
          if [ ! -f "ios/App/App.xcodeproj/project.pbxproj" ]; then
            rm -rf ios
            npx cap add ios
          fi
          if [ -d "tools/ios_assets" ]; then
            mkdir -p ios/App/App/Assets.xcassets/AppIcon.appiconset
            mkdir -p ios/App/App/Assets.xcassets/Splash.imageset
            cp -R tools/ios_assets/AppIcon.appiconset/* ios/App/App/Assets.xcassets/AppIcon.appiconset/ 2>/dev/null || true
            cp -R tools/ios_assets/Splash.imageset/* ios/App/App/Assets.xcassets/Splash.imageset/ 2>/dev/null || true
            cp tools/ios_assets/Info.plist ios/App/App/Info.plist 2>/dev/null || true
          fi
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install
      - name: Build for iOS Simulator
        script: |
          echo ">>> Compiling Marity Trade for iOS Simulator..."
          xcodebuild -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build/derivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build
          
          mkdir -p build/ios/simulator
          cd build/derivedData/Build/Products/Debug-iphonesimulator
          zip -r -X ../../../../../build/ios/simulator/MarityTrade-Simulator.app.zip App.app
    artifacts:
      - build/ios/simulator/*.zip
      - /tmp/xcodebuild_logs/*.log

  android-release:
    name: Marity Trade — Android Release (Google Play Bundle & APK)
    max_build_duration: 40
    instance_type: mac_mini_m2
    environment:
      vars:
        PACKAGE_NAME: "com.maritytrade.app"
      java: 17
      node: 20
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: master
          include: true
          source: true
    scripts:
      - name: Install dependencies & build mobile web bundle
        script: |
          echo ">>> Installing Node dependencies..."
          npm install --legacy-peer-deps
          echo ">>> Preparing production mobile web bundle..."
          node tools/prepare_ios_bundle.js
      - name: Setup Capacitor Android Native Project
        script: |
          echo ">>> Initializing Capacitor Android Platform..."
          if [ ! -d "android/app" ]; then
            echo ">>> Running npx cap add android to generate Android project..."
            rm -rf android
            npx cap add android
          fi
          
          # Inject luxury Android mipmap icons, splash, and colors
          if [ -d "tools/android_assets" ]; then
            echo ">>> Injecting luxury Android AppIcons and Splash..."
            cp -R tools/android_assets/mipmap-* android/app/src/main/res/ 2>/dev/null || true
            cp -R tools/android_assets/drawable* android/app/src/main/res/ 2>/dev/null || true
            cp -R tools/android_assets/values/* android/app/src/main/res/values/ 2>/dev/null || true
            rm -f android/app/src/main/res/values/ic_launcher_background.xml 2>/dev/null || true
          fi
          
          # Enforce Google Play compliance (no unnecessary permissions)
          sed -i.bak '/android.permission.READ_PHONE_STATE/d' android/app/src/main/AndroidManifest.xml 2>/dev/null || true
          
          echo ">>> Syncing Capacitor Android..."
          npx cap sync android
          rm -f android/app/src/main/res/values/ic_launcher_background.xml 2>/dev/null || true
      - name: Build & Sign Android Release Bundle (.aab) & APK
        script: |
          set -e
          echo ">>> Locating Android Release Keystore..."
          STORE_PASS="MarityTrade2026!"
          KEY_ALIAS="marity"
          KEY_PASS="MarityTrade2026!"
          
          if [ -n "$CM_KEYSTORE" ] && [ -f "$CM_KEYSTORE" ]; then
            KEYSTORE_PATH="$CM_KEYSTORE"
            STORE_PASS="${CM_KEYSTORE_PASSWORD:-$STORE_PASS}"
            KEY_ALIAS="${CM_KEY_ALIAS:-$KEY_ALIAS}"
            KEY_PASS="${CM_KEY_PASSWORD:-$KEY_PASS}"
            echo "✓ Using Codemagic configured keystore: $KEYSTORE_PATH"
          elif [ -f "tools/keys/marity-release.keystore" ]; then
            KEYSTORE_PATH="$(pwd)/tools/keys/marity-release.keystore"
            echo "✓ Using repository release keystore: $KEYSTORE_PATH"
          else
            echo ">>> Generating fallback release keystore..."
            KEYSTORE_PATH="$HOME/marity-release.keystore"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=Marity Trade, OU=Mobile, O=Marity Trade, L=Accra, C=GH"
          fi
          
          echo ">>> Compiling Android Release App Bundle & APK..."
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --stacktrace
          
          echo ">>> Checking generated build outputs..."
          ls -la app/build/outputs/bundle/release/ 2>/dev/null || true
          ls -la app/build/outputs/apk/release/ 2>/dev/null || true
          
          echo ">>> Signing Release App Bundle (.aab) for Google Play..."
          AAB_PATH=$(find app/build/outputs/bundle -name "*.aab" | head -n 1)
          if [ -f "$AAB_PATH" ]; then
            jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore "$KEYSTORE_PATH" \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              "$AAB_PATH" "$KEY_ALIAS"
            echo "✓ Google Play Release AAB successfully signed: $AAB_PATH"
          fi
          
          echo ">>> Signing Release APK (v1 + v2/v3 signing)..."
          APK_RAW=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -f "$APK_RAW" ]; then
            APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name "apksigner" 2>/dev/null | sort -V | tail -n 1)
            ZIPALIGN=$(find $ANDROID_SDK_ROOT/build-tools -name "zipalign" 2>/dev/null | sort -V | tail -n 1)
            
            mkdir -p ../build/android/release
            ALIGNED_APK="../build/android/release/MarityTrade-v1.0.0-Release.apk"
            
            if [ -n "$ZIPALIGN" ] && [ -x "$ZIPALIGN" ]; then
              "$ZIPALIGN" -v -p 4 "$APK_RAW" "$ALIGNED_APK" || cp "$APK_RAW" "$ALIGNED_APK"
            else
              cp "$APK_RAW" "$ALIGNED_APK"
            fi
            
            if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
              "$APKSIGNER" sign \
                --ks "$KEYSTORE_PATH" \
                --ks-pass "pass:$STORE_PASS" \
                --ks-key-alias "$KEY_ALIAS" \
                --key-pass "pass:$KEY_PASS" \
                --v1-signing-enabled true \
                --v2-signing-enabled true \
                --v3-signing-enabled true \
                "$ALIGNED_APK"
              echo "✓ Release APK successfully signed with apksigner (v1 + v2 + v3): $ALIGNED_APK"
              "$APKSIGNER" verify -v "$ALIGNED_APK" || true
            else
              jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
                -keystore "$KEYSTORE_PATH" \
                -storepass "$STORE_PASS" \
                -keypass "$KEY_PASS" \
                "$ALIGNED_APK" "$KEY_ALIAS"
              echo "✓ Release APK signed with jarsigner: $ALIGNED_APK"
            fi
          fi
          
          echo ">>> Signing Release App Bundle (.aab) for Google Play..."
          AAB_PATH=$(find app/build/outputs/bundle -name "*.aab" | head -n 1)
          if [ -f "$AAB_PATH" ]; then
            jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore "$KEYSTORE_PATH" \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              "$AAB_PATH" "$KEY_ALIAS"
            echo "✓ Google Play Release AAB successfully signed: $AAB_PATH"
          fi
          
          echo ">>> Signing Release APK (v1 + v2/v3 signing)..."
          APK_RAW=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -f "$APK_RAW" ]; then
            APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name "apksigner" 2>/dev/null | sort -V | tail -n 1)
            ZIPALIGN=$(find $ANDROID_SDK_ROOT/build-tools -name "zipalign" 2>/dev/null | sort -V | tail -n 1)
            
            mkdir -p ../build/android/release
            ALIGNED_APK="../build/android/release/MarityTrade-v1.0.0-Release.apk"
            
            if [ -n "$ZIPALIGN" ] && [ -x "$ZIPALIGN" ]; then
              "$ZIPALIGN" -v -p 4 "$APK_RAW" "$ALIGNED_APK" || cp "$APK_RAW" "$ALIGNED_APK"
            else
              cp "$APK_RAW" "$ALIGNED_APK"
            fi
            
            if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
              "$APKSIGNER" sign \
                --ks "$KEYSTORE_PATH" \
                --ks-pass "pass:$STORE_PASS" \
                --ks-key-alias "$KEY_ALIAS" \
                --key-pass "pass:$KEY_PASS" \
                --v1-signing-enabled true \
                --v2-signing-enabled true \
                --v3-signing-enabled true \
                "$ALIGNED_APK"
              echo "✓ Release APK successfully signed with apksigner (v1 + v2 + v3): $ALIGNED_APK"
              "$APKSIGNER" verify -v "$ALIGNED_APK" || true
            else
              jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
                -keystore "$KEYSTORE_PATH" \
                -storepass "$STORE_PASS" \
                -keypass "$KEY_PASS" \
                "$ALIGNED_APK" "$KEY_ALIAS"
              echo "✓ Release APK signed with jarsigner: $ALIGNED_APK"
            fi
          fi
    artifacts:
      - android/app/build/outputs/bundle/**/*.aab
      - build/android/release/*.apk
      - android/app/build/outputs/apk/**/*.apk

  android-debug:
    name: Marity Trade — Android Direct Install Test APK
    max_build_duration: 25
    instance_type: mac_mini_m2
    environment:
      java: 17
      node: 20
    scripts:
      - name: Install dependencies & build mobile bundle
        script: |
          npm install --legacy-peer-deps
          node tools/prepare_ios_bundle.js
          if [ ! -d "android/app" ]; then
            rm -rf android
            npx cap add android
          fi
          if [ -d "tools/android_assets" ]; then
            cp -R tools/android_assets/mipmap-* android/app/src/main/res/ 2>/dev/null || true
            cp -R tools/android_assets/drawable* android/app/src/main/res/ 2>/dev/null || true
            cp -R tools/android_assets/values/* android/app/src/main/res/values/ 2>/dev/null || true
            rm -f android/app/src/main/res/values/ic_launcher_background.xml 2>/dev/null || true
          fi
          npx cap sync android
          rm -f android/app/src/main/res/values/ic_launcher_background.xml 2>/dev/null || true
      - name: Build Debug APK
        script: |
          set -e
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          mkdir -p ../build/android/test_apk
          cp app/build/outputs/apk/debug/*.apk ../build/android/test_apk/MarityTrade-Test-DirectInstall.apk
          echo "✓ Direct install test APK created successfully: ../build/android/test_apk/MarityTrade-Test-DirectInstall.apk"
    artifacts:
      - build/android/test_apk/*.apk
      - android/app/build/outputs/apk/**/*.apk
